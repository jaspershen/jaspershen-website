{{ $photos := resources.Match "media/albums/photo/*" }}
{{ $photos = where $photos "ResourceType" "image" }}
<div class="col-12 personal-photos" role="region" aria-label="Photos" aria-roledescription="carousel" tabindex="0">
  <div class="personal-photos__stage">
    {{ range $i, $photo := $photos }}
    <button class="personal-photos__slide" type="button" data-index="{{ $i }}" aria-label="Show photo {{ add $i 1 }}">
      <img src="{{ $photo.RelPermalink }}" alt="Photo {{ add $i 1 }}" loading="lazy" draggable="false">
    </button>
    {{ end }}
  </div>
  <div class="personal-photos__controls">
    <button type="button" data-step="-1" aria-label="Previous photo"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
    <span aria-live="polite"></span>
    <button type="button" data-step="1" aria-label="Next photo"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
  </div>
  <a href="{{ "photos/" | relLangURL }}">SEE ALL <i class="fas fa-chevron-right" aria-hidden="true"></i></a>
</div>
<script>
(function () {
  var root = document.querySelector('.personal-photos');
  if (!root) return;
  var slides = Array.from(root.querySelectorAll('.personal-photos__slide'));
  if (!slides.length) return;
  var current = 0;
  function show(index) {
    current = (index + slides.length) % slides.length;
    slides.forEach(function (slide, i) {
      var offset = (i - current + slides.length) % slides.length;
      if (offset > slides.length / 2) offset -= slides.length;
      slide.dataset.position = offset;
      slide.tabIndex = Math.abs(offset) <= 1 ? 0 : -1;
      slide.setAttribute('aria-hidden', Math.abs(offset) > 1 ? 'true' : 'false');
    });
    root.querySelector('[aria-live]').textContent = (current + 1) + ' / ' + slides.length;
  }
  slides.forEach(function (slide, i) { slide.addEventListener('click', function () { show(i); }); });
  root.querySelectorAll('[data-step]').forEach(function (button) {
    button.addEventListener('click', function () { show(current + Number(button.dataset.step)); });
  });
  root.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault(); show(current + (event.key === 'ArrowRight' ? 1 : -1));
    }
  });
  show(0);
})();
</script>
